<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar Hadir Pengunjung</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins&display=swap" rel="stylesheet">

  <style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: white;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(31,38,135,0.37);
    padding: 30px; width:100%; max-width: 700px;
  }
  h2 { font-family: 'Playfair Display', serif; text-align:center; margin-bottom: 10px; }
  h5 { text-align:center; margin-bottom: 30px; font-weight: 400; color: rgba(255,255,255,0.9); }
  .form-control, .form-check-input {
    background: rgba(255,255,255,0.2)!important;
    border: 1px solid rgba(255,255,255,0.3)!important;
    color: white!important; border-radius: 10px!important;
  }
  .form-control::placeholder { color: rgba(255,255,255,0.7)!important; }

  /* 🔥 CUSTOM RADIO BUTTON */

 /* 🔥 RADIO BUTTON CUSTOM STYLING LEBIH KONTRAS */
.form-check-input[type="radio"] {
  appearance: none; /* Hilangkan style default */
  -webkit-appearance: none;
  background-color: transparent;
  border: 2px solid #fff;
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease-in-out;
  margin-right: 8px;
}

.form-check-input[type="radio"]:checked {
  border-color: gold;
  background-color: transparent;
  box-shadow: 0 0 5px gold;
}

.form-check-input[type="radio"]:checked::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 12px; height: 12px;
  background: #5e06ca; /* Lingkaran hitam tebal di tengah */
  border-radius: 50%;
}


  .btn-primary {
    background: linear-gradient(45deg, #bfa46f, #a88f54); border:none; border-radius:50px;
    padding: 12px 30px; font-weight:600; transition: all .3s;
  }
  .btn-primary:disabled {
    background: #aaa; cursor: not-allowed;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  #thankYouPage { display:none; text-align:center; }
  @media (max-width: 576px) {
    h2 { font-size: 1.5rem; }
    .glass-card { padding: 20px; }
    .form-control { font-size: 14px; }
  }
</style>

</head>
<body>
  <div class="container-fluid d-flex justify-content-center">
    <!-- FORMULIR DAFTAR HADIR -->
    <div class="glass-card" id="mainForm">
      <h2>DAFTAR HADIR PENGUNJUNG<br>APKASI OTONOMI EXPO 2025</h2>
      <h5>DPMPTSP Kabupaten Gunungkidul</h5>

      <form id="attendForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" class="form-control" name="nama" required placeholder="Masukkan nama Anda" />
        </div>
        <div class="mb-3">
          <label class="form-label">Alamat</label>
          <input type="text" class="form-control" name="alamat" required placeholder="Masukkan alamat lengkap" />
        </div>
        <div class="mb-3">
          <label class="form-label">Asal (Perusahaan/Instansi)</label>
          <input type="text" class="form-control" name="asal" required placeholder="Nama perusahaan atau instansi" />
        </div>
        <div class="mb-3">
          <label class="form-label">Nomor HP/WA</label>
          <input type="tel" class="form-control" name="kontak" required placeholder="08xxxxxxxxxx" />
        </div>
        <div class="mb-3">
          <label class="form-label">Tanggal Kunjungan</label>
          <div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tanggal" value="28 Agustus 2025" required />
              <label class="form-check-label">28 Agustus 2025</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tanggal" value="29 Agustus 2025" />
              <label class="form-check-label">29 Agustus 2025</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tanggal" value="30 Agustus 2025" />
              <label class="form-check-label">30 Agustus 2025</label>
            </div>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            Kirim Jawaban
          </button>
        </div>
        <div id="notif" class="mt-3"></div>
      </form>
    </div>

    <!-- HALAMAN TERIMA KASIH -->
    <div class="glass-card" id="thankYouPage">
      <h2>Terima Kasih!</h2>
      <p class="mt-3">Data kehadiran Anda berhasil dikirimkan.</p>
      <button class="btn btn-light mt-3" id="newFormBtn">Isi Formulir Baru</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById("attendForm");
    const notif = document.getElementById("notif");
    const submitBtn = document.getElementById("submitBtn");
    const mainForm = document.getElementById("mainForm");
    const thankYouPage = document.getElementById("thankYouPage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      notif.innerHTML = "";

      // Validasi manual jika ada field kosong
      if (!form.checkValidity()) {
        notif.innerHTML = `<div class="alert alert-warning">⚠️ Harap lengkapi semua field sebelum mengirim.</div>`;
        return;
      }

      // Disable tombol + animasi loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Mengirim...`;

      const data = {
        nama: form.nama.value.trim(),
        alamat: form.alamat.value.trim(),
        asal: form.asal.value.trim(),
        kontak: form.kontak.value.trim(),
        tanggal: form.tanggal.value
      };

      try {
        const res = await fetch("/api/visitorapi.js", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (json.ok) {
          mainForm.style.display = "none";
          thankYouPage.style.display = "block";
        } else {
          notif.innerHTML = `<div class="alert alert-danger">❌ ${json.message}</div>`;
        }
      } catch (err) {
        notif.innerHTML = `<div class="alert alert-danger">❌ ${err}</div>`;
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = "Kirim Jawaban";
    });

    // Tombol isi form baru
    document.getElementById("newFormBtn").addEventListener("click", () => {
      form.reset();
      notif.innerHTML = "";
      thankYouPage.style.display = "none";
      mainForm.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
