<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Calon Investor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .signature-box {
      margin-top: 16px;
    }
    canvas {
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      height: 200px;
    }
    button {
      margin-top: 16px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .success {
      margin-top: 16px;
      padding: 12px;
      background: #d4edda;
      color: #155724;
      border-radius: 6px;
    }
    .error {
      margin-top: 16px;
      padding: 12px;
      background: #f8d7da;
      color: #721c24;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Formulir Calon Investor</h1>
    <form id="investForm">
      <label>Nama</label>
      <input type="text" name="nama" required />

      <label>Alamat</label>
      <textarea name="alamat"></textarea>

      <label>Nama Perusahaan</label>
      <input type="text" name="nama_perusahaan" />

      <label>Alamat Perusahaan</label>
      <textarea name="alamat_perusahaan"></textarea>

      <label>Email</label>
      <input type="email" name="email" />

      <label>No. HP / Whatsapp</label>
      <input type="text" name="kontak" />

      <label>Sektor</label>
      <div>
        <input type="checkbox" name="sektor" value="Pertanian" /> Pertanian
        <input type="checkbox" name="sektor" value="Pariwisata" /> Pariwisata
        <input type="checkbox" name="sektor" value="Industri" /> Industri
      </div>

      <label>Sektor Lainnya</label>
      <input type="text" name="sektor_lainnya" placeholder="Tuliskan jika tidak ada di atas" />

      <label>Lokasi</label>
      <input type="text" name="lokasi" />

      <label>Jenis Usaha</label>
      <input type="text" name="jenis_usaha" />

      <label>Luasan</label>
      <input type="text" name="luasan" />

      <label>Nilai Investasi</label>
      <input type="text" name="nilai_investasi" />

      <div class="signature-box">
        <label>Tanda Tangan</label>
        <canvas id="signatureCanvas"></canvas>
        <button type="button" onclick="clearSignature()">Hapus Tanda Tangan</button>
      </div>

      <button type="submit">Kirim</button>
    </form>

    <div id="message"></div>
  </div>

  <!-- SignaturePad library -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

  <script>
    const canvas = document.getElementById("signatureCanvas");
    const signaturePad = new SignaturePad(canvas);

    // agar canvas sesuai ukuran
    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = 200 * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    function clearSignature() {
      signaturePad.clear();
    }

    // fungsi untuk export tanda tangan dengan background putih (JPEG)
    function getSignatureWithWhiteBG() {
      if (signaturePad.isEmpty()) return "";

      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext("2d");

      // isi background putih
      tempCtx.fillStyle = "#ffffff";
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      // gambar signature di atas putih
      tempCtx.drawImage(canvas, 0, 0);

      return tempCanvas.toDataURL("image/jpeg", 0.7);
    }

    document.getElementById("investForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {};
      formData.forEach((val, key) => {
        if (data[key]) {
          if (!Array.isArray(data[key])) data[key] = [data[key]];
          data[key].push(val);
        } else {
          data[key] = val;
        }
      });

      // tanda tangan
      data.tanda_tangan_base64 = getSignatureWithWhiteBG();

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const json = await res.json();
        if (json.ok) {
          document.getElementById("message").innerHTML = `<div class="success">✅ ${json.message}</div>`;
          e.target.reset();
          signaturePad.clear();
        } else {
          document.getElementById("message").innerHTML = `<div class="error">❌ ${json.message}</div>`;
        }
      } catch (err) {
        document.getElementById("message").innerHTML = `<div class="error">❌ ${err}</div>`;
      }
    });
  </script>
</body>
</html>
