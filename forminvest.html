<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Investasi - Minimal Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <h2>Form Investasi (Test)</h2>
  
  <form id="investForm">
    <label>
      Nama:<br>
      <input type="text" name="nama" required>
    </label>
    <br><br>

    <label>
      Nama Perusahaan:<br>
      <input type="text" name="nama_perusahaan" required>
    </label>
    <br><br>

    <label>
      Email:<br>
      <input type="email" name="email" required>
    </label>
    <br><br>

    <button type="submit">Kirim</button>
  </form>

  <pre id="result" style="margin-top:20px; background:#f5f5f5; padding:10px;"></pre>

  <script>
    const form = document.getElementById("investForm");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        nama: form.nama.value,
        nama_perusahaan: form.nama_perusahaan.value,
        email: form.email.value,
        tanda_tangan_base64: "abc123" // dummy biar field gak kosong
      };

      resultBox.textContent = "Mengirim data...";

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const json = await res.json();
        resultBox.textContent = JSON.stringify(json, null, 2);

      } catch (err) {
        resultBox.textContent = "Fetch error: " + err.toString();
      }
    });
  </script>
</body>
</html>
