<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Kepeminatan Investasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      font-family: "Segoe UI", sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
    }
    label {
      font-weight: 500;
      margin-top: 10px;
    }
    canvas {
      border: 2px dashed #555;
      border-radius: 10px;
      width: 100%;
      height: 200px;
      background: white;
    }
    #thankYouPage {
      display: none;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <h3 class="text-center mb-4 text-white">Formulir Kepeminatan Investasi</h3>

    <!-- Form Utama -->
    <form id="investForm">
      <div class="form-group">
        <label>Nama</label>
        <input type="text" class="form-control" name="nama" required>
      </div>

      <div class="form-group">
        <label>Alamat</label>
        <textarea class="form-control" name="alamat" required></textarea>
      </div>

      <div class="form-group">
        <label>Nama Perusahaan</label>
        <input type="text" class="form-control" name="nama_perusahaan" required>
      </div>

      <div class="form-group">
        <label>Alamat Perusahaan</label>
        <textarea class="form-control" name="alamat_perusahaan" required></textarea>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>

      <div class="form-group">
        <label>No. HP / Whatsapp</label>
        <input type="text" class="form-control" name="no_hp" required>
      </div>

      <div class="form-group">
        <label>Sektor (pilih satu atau lebih)</label><br>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Pertanian" name="sektor">
          <label class="form-check-label">Pertanian</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Pariwisata" name="sektor">
          <label class="form-check-label">Pariwisata</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Industri" name="sektor">
          <label class="form-check-label">Industri</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Lainnya" name="sektor">
          <label class="form-check-label">Lainnya</label>
        </div>
      </div>

      <div class="form-group">
        <label>Lokasi</label>
        <input type="text" class="form-control" name="lokasi">
      </div>

      <div class="form-group">
        <label>Jenis Usaha</label>
        <input type="text" class="form-control" name="jenis_usaha">
      </div>

      <div class="form-group">
        <label>Luasan</label>
        <input type="text" class="form-control" name="luasan">
      </div>

      <div class="form-group">
        <label>Nilai Investasi</label>
        <input type="text" class="form-control" name="nilai_investasi">
      </div>

      <div class="form-group">
        <label>Tanda Tangan</label>
        <canvas id="signaturePad"></canvas>
        <button type="button" class="btn btn-sm btn-secondary mt-2" id="clearSig">Hapus Tanda Tangan</button>
      </div>

      <button type="submit" class="btn btn-light w-100 mt-3">Kirim</button>
    </form>

    <!-- Halaman Terima Kasih -->
    <div id="thankYouPage">
      <h2><i class="bi bi-check-circle"></i> Terima Kasih!</h2>
      <p>Formulir Anda telah berhasil dikirimkan.</p>
      <button class="btn btn-light mt-3" onclick="window.location.reload()">Isi Formulir Baru</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("investForm");
    const thankYouPage = document.getElementById("thankYouPage");
    const canvas = document.getElementById("signaturePad");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    // Resize canvas responsif
    function resizeCanvas() {
      const data = canvas.toDataURL(); // simpan gambar lama
      canvas.width = canvas.offsetWidth;
      canvas.height = 200;
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = data;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    canvas.addEventListener("mousedown", () => drawing = true);
    canvas.addEventListener("mouseup", () => drawing = false);
    canvas.addEventListener("mouseout", () => drawing = false);
    canvas.addEventListener("mousemove", draw);

    function draw(e) {
      if (!drawing) return;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#000";
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    document.getElementById("clearSig").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const sektor = [...document.querySelectorAll('input[name="sektor"]:checked')]
        .map(el => el.value);

      const data = {
        nama: form.nama.value,
        alamat: form.alamat.value,
        nama_perusahaan: form.nama_perusahaan.value,
        alamat_perusahaan: form.alamat_perusahaan.value,
        email: form.email.value,
        no_hp: form.no_hp.value,
        sektor: sektor,
        lokasi: form.lokasi.value,
        jenis_usaha: form.jenis_usaha.value,
        luasan: form.luasan.value,
        nilai_investasi: form.nilai_investasi.value,
        tanda_tangan_base64: canvas.toDataURL()
      };

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const json = await res.json();
        if (json.ok) {
          form.style.display = "none";
          thankYouPage.style.display = "block";
        } else {
          alert("Gagal: " + json.message);
        }
      } catch (err) {
        alert("Fetch error: " + err.toString());
      }
    });
  </script>
</body>
</html>
