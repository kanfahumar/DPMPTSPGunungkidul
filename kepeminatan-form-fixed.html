<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Kepeminatan Investasi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: white;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      padding: 30px;
      width: 100%;
      max-width: 900px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-control,
    .form-select,
    textarea {
      background: rgba(255, 255, 255, 0.2) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      color: white !important;
      border-radius: 10px !important;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7) !important;
    }

    .btn-primary {
      background: linear-gradient(45deg, #bfa46f, #a88f54);
      border: none;
      border-radius: 50px;
      padding: 12px 30px;
      font-weight: 600;
      transition: all .3s;
    }

    .btn-primary:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    #signatureCanvas {
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      background: #fff;
      width: 100%;
      height: 180px;
      cursor: crosshair;
      touch-action: none;
      /* penting untuk mobile */
    }

    #thankYouPage {
      display: none;
      text-align: center;
    }

    @media (max-width: 576px) {
      h2 {
        font-size: 1.5rem;
      }

      .glass-card {
        padding: 20px;
      }

      .form-control {
        font-size: 14px;
      }

      #signatureCanvas {
        height: 120px;
      }
    }

    .form-select {
      color: rgb(179, 51, 51);
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 16px 12px;
    }

    .form-select option {
      color: #111;
      background: linear-gradient(135deg, #9090e3, #9696d9);
    }

    .form-select:focus {
      border-color: #bfa46f;
      box-shadow: 0 0 0 0.25rem rgba(191, 164, 111, 0.25);
    }

    .form-select option[value=""] {
      color: #999;
    }

    /* Progress indicator */
    .upload-progress {
      display: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 15px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .upload-progress.show {
      display: block;
    }
  </style>
</head>

<body>
  <div class="container-fluid d-flex justify-content-center">
    <div class="glass-card" id="mainFormWrapper">
      <h2><i class="bi bi-handshake me-2"></i>Formulir Kepeminatan Investasi</h2>

      <form id="investForm" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-person me-2"></i>Nama Lengkap <span
                class="text-warning">*</span></label>
            <input type="text" class="form-control" name="nama" required placeholder="Nama lengkap Anda" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-geo-alt me-2"></i>Alamat</label>
            <input type="text" class="form-control" name="alamat" placeholder="Alamat lengkap" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-buildings me-2"></i>Nama Perusahaan</label>
            <input type="text" class="form-control" name="nama_perusahaan" placeholder="Nama perusahaan (jika ada)" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-pin-map me-2"></i>Alamat Perusahaan</label>
            <input type="text" class="form-control" name="alamat_perusahaan" placeholder="Alamat kantor/perusahaan" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-envelope me-2"></i>Email</label>
            <input type="email" class="form-control" name="email" placeholder="contoh@email.com" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-phone me-2"></i>No HP / Whatsapp</label>
            <input type="tel" class="form-control" name="kontak" placeholder="08xxxxxxxxxx" />
          </div>
        </div>

        <!-- Sektor Investasi -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-diagram-3 me-2"></i>Kepeminatan Investasi - Sektor <span
              class="text-warning">*</span></label>
          <div class="row">
            <div class="col-md-6">
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Pertanian" /><label
                  class="form-check-label">Pertanian</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Perkebunan" /><label
                  class="form-check-label">Perkebunan</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox"
                  value="Perikanan Kelautan" /><label class="form-check-label">Perikanan Kelautan</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Pariwisata" /><label
                  class="form-check-label">Pariwisata</label></div>
            </div>
            <div class="col-md-6">
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Kesehatan" /><label
                  class="form-check-label">Kesehatan</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Peternakan" /><label
                  class="form-check-label">Peternakan</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox"
                  value="Perindustrian" /><label class="form-check-label">Perindustrian</label></div>
              <div class="form-check"><input class="form-check-input sektor" type="checkbox" value="Pendidikan" /><label
                  class="form-check-label">Pendidikan</label></div>
              <div class="form-check"><input id="sektorLain" class="form-check-input sektor" type="checkbox"
                  value="Lainnya" /><label class="form-check-label">Lainnya</label></div>
            </div>
          </div>
          <input type="text" id="inputSektorLain" class="form-control mt-2" placeholder="Sebutkan sektor lainnya..."
            style="display:none;" />
        </div>

        <!-- Lokasi -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-geo me-2"></i>Lokasi Kepeminatan Investasi <span
              class="text-warning">*</span></label>
          <div class="row">
            <div class="col-md-6 mb-3">
              <select class="form-select" id="kapanewonSelect" required>
                <option value="">Pilih Kapanewon...</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <select class="form-select" id="kalurahanSelect" required disabled>
                <option value="">Pilih Kalurahan...</option>
              </select>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-briefcase me-2"></i>Jenis Usaha</label>
          <input type="text" class="form-control" name="jenis_usaha" placeholder="Jenis usaha yang diminati" />
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-aspect-ratio me-2"></i>Luasan</label>
          <input type="text" class="form-control" name="luasan" placeholder="Contoh: 2 hektar" />
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-cash-stack me-2"></i>Nilai Investasi</label>
          <input type="text" class="form-control" name="nilai_investasi" placeholder="Contoh: Rp 500.000.000" />
        </div>

        <!-- Notifikasi -->
        <div id="notif" class="mb-3"></div>

        <!-- Tanda Tangan -->
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-pen me-2"></i>Tanda Tangan <span
              class="text-warning">*</span></label>
          <canvas id="signatureCanvas"></canvas>
          <div class="d-flex gap-2 mt-2">
            <button type="button" class="btn btn-sm btn-outline-light" id="clearSignature">
              <i class="bi bi-eraser me-1"></i>Hapus Tanda Tangan
            </button>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <i class="bi bi-send me-1"></i>Kirim Formulir
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Halaman terima kasih -->
  <div class="container-fluid d-flex justify-content-center" id="thankYouPage" style="display:none!important;">
    <div class="glass-card" style="text-align:center;">
      <div style="font-size: 4rem;">✅</div>
      <h2 class="mt-3"><i class="bi bi-check-circle text-success me-2"></i>Terima Kasih!</h2>
      <p class="mt-3 fs-5">Formulir kepeminatan investasi Anda telah berhasil dikirimkan.</p>
      <p class="text-white-50">Data dan tanda tangan Anda sudah tersimpan. Tim kami akan segera menghubungi Anda.</p>
      <button class="btn btn-light mt-3" id="newFormBtn">
        <i class="bi bi-arrow-repeat me-1"></i>Isi Formulir Baru
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script>
    // ================================================================
    //  KONFIGURASI — Ganti dengan URL GAS Anda setelah deploy
    //  Format: https://script.google.com/macros/s/XXXX/exec
    // ================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycby26l-ni9xFCTC-TI-_Jh3u1m-Z072cuHCXefdqWzBUVq7GbVuoNqTV-MmWVCvXSYcqVg/exec";

    // ================================================================
    //  Inisialisasi elemen
    // ================================================================
    const form = document.getElementById("investForm");
    const notif = document.getElementById("notif");
    const thankYouPage = document.getElementById("thankYouPage");
    const submitBtn = document.getElementById("submitBtn");
    const sektorLain = document.getElementById('sektorLain');
    const inputSektorLain = document.getElementById('inputSektorLain');
    const kapanewonSelect = document.getElementById('kapanewonSelect');
    const kalurahanSelect = document.getElementById('kalurahanSelect');
    const canvas = document.getElementById("signatureCanvas");
    const signaturePad = new SignaturePad(canvas, {
      backgroundColor: 'rgb(255,255,255)',
      penColor: 'rgb(0,0,0)',
    });

    // ================================================================
    //  Data Kapanewon & Kalurahan (Gunungkidul)
    // ================================================================
    const kapanewonData = [
      { "kapanewon": "Gedangsari", "kalurahan": ["Hargomulyo", "Mertelu", "Ngalang", "Sampang", "Serut", "Tegalrejo", "Watugajah"] },
      { "kapanewon": "Girisubo", "kalurahan": ["Balong", "Jepitu", "Karangawen", "Jerukwudel", "Nglindur", "Pucung", "Songbanyu", "Tileng"] },
      { "kapanewon": "Karangmojo", "kalurahan": ["Bejiharjo", "Bendungan", "Gedangrejo", "Jatiayu", "Karangmojo", "Kelor", "Ngawis", "Ngipak", "Wiladeg"] },
      { "kapanewon": "Ngawen", "kalurahan": ["Beji", "Jurangjero", "Kampung", "Sambirejo", "Tancep", "Watusigar"] },
      { "kapanewon": "Nglipar", "kalurahan": ["Katongan", "Kedungkeris", "Kedungpoh", "Natah", "Nglipar", "Pengkol", "Pilangrejo"] },
      { "kapanewon": "Paliyan", "kalurahan": ["Giring", "Grogol", "Karangasem", "Karangduwet", "Mulusan", "Pampang", "Sodo"] },
      { "kapanewon": "Panggang", "kalurahan": ["Giriharjo", "Girikarto", "Girimulyo", "Girisekar", "Girisuko", "Giriwungu"] },
      { "kapanewon": "Patuk", "kalurahan": ["Beji", "Bunder", "Nglanggeran", "Nglegi", "Ngoro-oro", "Patuk", "Pengkok", "Putat", "Salam", "Semoyo", "Terbah"] },
      { "kapanewon": "Playen", "kalurahan": ["Banaran", "Bandung", "Banyusoco", "Bleberan", "Dengok", "Gading", "Getas", "Logandeng", "Ngawu", "Ngleri", "Ngunut", "Playen", "Plembutan"] },
      { "kapanewon": "Ponjong", "kalurahan": ["Bedoyo", "Genjahan", "Gombang", "Karangasem", "Kenteng", "Ponjong", "Sawahan", "Sidorejo", "Sumbergiri", "Tambakromo", "Umbulrejo"] },
      { "kapanewon": "Purwosari", "kalurahan": ["Giriasih", "Giricahyo", "Girijati", "Giripurwo", "Giritirto"] },
      { "kapanewon": "Rongkop", "kalurahan": ["Bohol", "Botodayaan", "Karangwuni", "Melikan", "Petir", "Pringombo", "Pucanganom", "Semugih"] },
      { "kapanewon": "Saptosari", "kalurahan": ["Jetis", "Kanigoro", "Kepek", "Krambilsawit", "Monggol", "Ngloro", "Planjan"] },
      { "kapanewon": "Semanu", "kalurahan": ["Candirejo", "Dadapayu", "Ngeposari", "Pacarejo", "Semanu"] },
      { "kapanewon": "Semin", "kalurahan": ["Bendung", "Bulurejo", "Candirejo", "Kalitekuk", "Karangsari", "Kemejing", "Pundungsari", "Rejosari", "Semin", "Sumberejo"] },
      { "kapanewon": "Tanjungsari", "kalurahan": ["Banjarejo", "Hargosari", "Kemadang", "Kemiri", "Ngestirejo"] },
      { "kapanewon": "Tepus", "kalurahan": ["Giripanggung", "Purwodadi", "Sidoharjo", "Sumberwungu", "Tepus"] },
      { "kapanewon": "Wonosari", "kalurahan": ["Duwet", "Gading", "Karangtengah", "Kepek", "Mulo", "Ngawu", "Piyaman", "Pulutan", "Selang", "Siraman", "Wonosari"] },
    ];

    // ================================================================
    //  Dropdown Kapanewon & Kalurahan
    // ================================================================
    function populateKapanewon() {
      kapanewonData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.kapanewon;
        opt.textContent = item.kapanewon;
        kapanewonSelect.appendChild(opt);
      });
    }

    function populateKalurahan(kapanewonName) {
      kalurahanSelect.innerHTML = '<option value="">Pilih Kalurahan...</option>';
      kalurahanSelect.disabled = true;
      const found = kapanewonData.find(i => i.kapanewon === kapanewonName);
      if (found) {
        found.kalurahan.forEach(k => {
          const opt = document.createElement('option');
          opt.value = k; opt.textContent = k;
          kalurahanSelect.appendChild(opt);
        });
        kalurahanSelect.disabled = false;
      }
    }

    kapanewonSelect.addEventListener('change', e => populateKalurahan(e.target.value));

    // ================================================================
    //  Toggle sektor lainnya
    // ================================================================
    sektorLain.addEventListener('change', () => {
      inputSektorLain.style.display = sektorLain.checked ? 'block' : 'none';
      if (!sektorLain.checked) inputSektorLain.value = '';
    });

    // ================================================================
    //  Canvas resize — tetap tajam di semua layar
    // ================================================================
    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const data = signaturePad.toData(); // simpan data sebelum resize
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
      if (data.length > 0) signaturePad.fromData(data); // restore
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.getElementById("clearSignature").addEventListener("click", () => signaturePad.clear());

    // ================================================================
    //  Kompres tanda tangan menjadi JPEG kualitas rendah
    //  supaya payload tidak terlalu besar (~50KB)
    // ================================================================
    function getCompressedSignature() {
      if (signaturePad.isEmpty()) return "";

      const tempCanvas = document.createElement("canvas");
      // Ukuran output tetap, terlepas dari DPI layar
      tempCanvas.width = 600;
      tempCanvas.height = 200;
      const ctx = tempCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

      // JPEG quality 0.6 — cukup jelas untuk tanda tangan
      return tempCanvas.toDataURL("image/jpeg", 0.6);
    }

    // ================================================================
    //  Helper: tampilkan notifikasi
    // ================================================================
    function showNotif(type, msg) {
      const icons = { warning: "⚠️", danger: "❌", info: "ℹ️", success: "✅" };
      notif.innerHTML = `<div class="alert alert-${type}">${icons[type] || ""} ${msg}</div>`;
      notif.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ================================================================
    //  Submit handler
    // ================================================================
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      notif.innerHTML = "";

      // — Validasi —
      const nama = form.nama.value.trim();
      if (!nama) { showNotif("warning", "Nama lengkap wajib diisi."); return; }

      const sektorTerpilih = Array.from(document.querySelectorAll(".sektor:checked")).map(el => el.value);
      if (sektorTerpilih.length === 0) { showNotif("warning", "Pilih minimal satu sektor investasi."); return; }
      if (sektorTerpilih.includes('Lainnya') && !inputSektorLain.value.trim()) {
        showNotif("warning", "Mohon isi detail 'Sektor lainnya'."); return;
      }

      if (!kapanewonSelect.value || !kalurahanSelect.value) {
        showNotif("warning", "Pilih Kapanewon dan Kalurahan lokasi investasi."); return;
      }

      const ttdBase64 = getCompressedSignature();
      if (!ttdBase64) { showNotif("warning", "Tanda tangan wajib diisi."); return; }

      // — Kunci tombol —
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Mengirim data...`;

      const payload = {
        nama,
        alamat: form.alamat.value.trim(),
        nama_perusahaan: form.nama_perusahaan.value.trim(),
        alamat_perusahaan: form.alamat_perusahaan.value.trim(),
        email: form.email.value.trim(),
        kontak: form.kontak.value.trim(),
        sektor: sektorTerpilih,
        sektor_lainnya: sektorLain.checked ? inputSektorLain.value.trim() : '',
        lokasi: `${kapanewonSelect.value}, ${kalurahanSelect.value}`,
        jenis_usaha: form.jenis_usaha.value.trim(),
        luasan: form.luasan.value.trim(),
        nilai_investasi: form.nilai_investasi.value.trim(),
        tanda_tangan_base64: ttdBase64,
      };

      try {
        // -------------------------------------------------------
        //  Kirim ke Google Apps Script
        //  Teknik: gunakan no-cors mode, anggap sukses jika tidak error
        //  (GAS tidak bisa set CORS header untuk binary response)
        // -------------------------------------------------------
        const res = await fetch(GAS_URL, {
          method: "POST",
          // GAS tidak support preflight CORS dengan baik,
          // jadi kita kirim sebagai text/plain agar tidak trigger preflight
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow",
        });

        let json = {};
        try {
          const text = await res.text();
          json = JSON.parse(text);
        } catch {
          // Kalau parse JSON gagal tapi request sampai, anggap sukses
          json = { ok: true };
        }

        if (json.ok !== false) {
          // Sukses — tampilkan halaman terima kasih
          document.getElementById("mainFormWrapper").style.display = "none";
          thankYouPage.setAttribute("style", "display:flex!important");
        } else {
          showNotif("danger", json.message || "Terjadi kesalahan. Silakan coba lagi.");
        }

      } catch (err) {
        let pesan = err.message;
        if (pesan.includes("Failed to fetch") || pesan.includes("NetworkError")) {
          pesan = "Tidak dapat terhubung ke server. Periksa koneksi internet Anda.";
        }
        showNotif("danger", pesan);
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="bi bi-send me-1"></i>Kirim Formulir`;
    });

    // ================================================================
    //  Reset & isi formulir baru
    // ================================================================
    document.getElementById("newFormBtn").addEventListener("click", () => {
      form.reset();
      signaturePad.clear();
      notif.innerHTML = "";
      kalurahanSelect.innerHTML = '<option value="">Pilih Kalurahan...</option>';
      kalurahanSelect.disabled = true;
      inputSektorLain.style.display = 'none';
      thankYouPage.setAttribute("style", "display:none!important");
      document.getElementById("mainFormWrapper").style.display = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // ================================================================
    //  Init
    // ================================================================
    populateKapanewon();
  </script>
</body>

</html>
