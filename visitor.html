<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Hadir Pengunjung APKASI Otonomi Expo 2025</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: white;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(31,38,135,0.37);
      padding: 30px; width:100%; max-width: 700px;
    }
    h2, h5 {
      text-align: center;
      margin-bottom: 15px;
    }
    h2 { font-family: 'Playfair Display', serif; }
    .form-control, .form-check-input {
      background: rgba(255,255,255,0.2)!important;
      border: 1px solid rgba(255,255,255,0.3)!important;
      color: white!important;
      border-radius: 10px!important;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.7)!important; }
    .form-check-label { color: white; }
    .btn-primary {
      background: linear-gradient(45deg, #bfa46f, #a88f54); border:none; border-radius:50px;
      padding: 12px 30px; font-weight:600; transition: all .3s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="container-fluid d-flex justify-content-center align-items-center">
    <div class="glass-card">
      <h2><i class="fas fa-users me-2"></i>DAFTAR HADIR PENGUNJUNG<br>APKASI OTONOMI EXPO 2025</h2>
      <h5>DPMPTSP Kabupaten Gunungkidul</h5>

      <form id="visitorForm" novalidate>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-2"></i>Nama Lengkap</label>
          <input type="text" class="form-control" name="namaLengkap" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-building me-2"></i>Asal (Perusahaan/Instansi)</label>
          <input type="text" class="form-control" name="asal">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-map-marker-alt me-2"></i>Alamat</label>
          <textarea class="form-control" name="alamat" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-phone me-2"></i>Nomor HP</label>
          <input type="tel" class="form-control" name="nomorHP" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-calendar-alt me-2"></i>Tanggal Kunjungan</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tanggalKunjungan" value="28 Agustus 2025" required>
            <label class="form-check-label">28 Agustus 2025</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tanggalKunjungan" value="29 Agustus 2025">
            <label class="form-check-label">29 Agustus 2025</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tanggalKunjungan" value="30 Agustus 2025">
            <label class="form-check-label">30 Agustus 2025</label>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane me-1"></i>Kirim Formulir
          </button>
        </div>
        <div id="notif" class="mt-3"></div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script Submit Visitor -->
  <script src="submitVisitor.js"></script>
</body>
</html>
