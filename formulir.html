<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulir Calon Investor</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px; color: white;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(31,38,135,0.37);
      padding: 30px; width:100%; max-width: 850px;
    }
    h2 { font-family: 'Playfair Display', serif; text-align:center; margin-bottom: 30px; }
    .form-control, .form-select, textarea {
      background: rgba(255,255,255,0.2)!important;
      border: 1px solid rgba(255,255,255,0.3)!important;
      color: white!important; border-radius: 10px!important;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.7)!important; }
    .btn-primary {
      background: linear-gradient(45deg, #bfa46f, #a88f54); border:none; border-radius:50px;
      padding: 12px 30px; font-weight:600; transition: all .3s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    #signatureCanvas {
      border: 1px solid rgba(255,255,255,0.3); border-radius:10px;
      background: #fff; width:100%; height:180px; cursor: crosshair;
    }
    #thankYouPage { display:none; text-align:center; }
    @media (max-width: 576px) {
      h2 { font-size: 1.5rem; }
      .glass-card { padding: 20px; }
      .form-control { font-size: 14px; }
      #signatureCanvas { height: 120px; }
    }
  </style>
</head>
<body>
  <div class="container-fluid d-flex justify-content-center">
    <!-- Form Utama -->
    <div class="glass-card" id="mainForm">
      <h2><i class="bi bi-handshake me-2"></i>Formulir Calon Investor</h2>

      <form id="investForm" novalidate>
        <!-- isian form sama seperti versi sebelumnya (nama, alamat, perusahaan, sektor, dst) -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-person me-2"></i>Nama Lengkap</label>
            <input type="text" class="form-control" name="nama" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"><i class="bi bi-geo-alt me-2"></i>Alamat</label>
            <input type="text" class="form-control" name="alamat" />
          </div>
        </div>
        <!-- ... potong untuk singkat, sektor dll sama seperti sebelumnya ... -->

        <div class="mb-3">
          <label class="form-label"><i class="bi bi-pen me-2"></i>Tanda Tangan</label>
          <canvas id="signatureCanvas"></canvas>
          <button type="button" class="btn btn-sm btn-outline-light mt-2" id="clearSignature">
            <i class="bi bi-eraser me-1"></i>Hapus Tanda Tangan
          </button>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-send me-1"></i>Kirim Formulir
          </button>
        </div>
        <div id="notif" class="mt-3"></div>
      </form>
    </div>

    <!-- Halaman Terima Kasih -->
    <div class="glass-card" id="thankYouPage">
      <h2><i class="bi bi-check-circle text-success"></i> Terima Kasih!</h2>
      <p class="mt-3">Formulir Anda telah berhasil dikirimkan.</p>
      <button class="btn btn-light mt-3" id="newFormBtn">
        <i class="bi bi-arrow-repeat me-1"></i>Isi Formulir Baru
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script>
    const form = document.getElementById("investForm");
    const notif = document.getElementById("notif");
    const mainForm = document.getElementById("mainForm");
    const thankYouPage = document.getElementById("thankYouPage");

    // Signature pad + fungsi dari basic.html (background putih)
    const canvas = document.getElementById("signatureCanvas");
    const signaturePad = new SignaturePad(canvas);
    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = 200 * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    function clearSignature() { signaturePad.clear(); }
    document.getElementById("clearSignature").addEventListener("click", clearSignature);

    function getSignatureWithWhiteBG() {
      if (signaturePad.isEmpty()) return "";
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext("2d");
      tempCtx.fillStyle = "#ffffff";
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      tempCtx.drawImage(canvas, 0, 0);
      return tempCanvas.toDataURL("image/jpeg", 0.7);
    }

    // submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (signaturePad.isEmpty()) {
        notif.innerHTML = `<div class="alert alert-warning">Tanda tangan wajib diisi.</div>`;
        return;
      }

      // ambil data
      const formData = new FormData(form);
      const data = {};
      formData.forEach((val, key) => {
        if (data[key]) {
          if (!Array.isArray(data[key])) data[key] = [data[key]];
          data[key].push(val);
        } else {
          data[key] = val;
        }
      });
      data.tanda_tangan_base64 = getSignatureWithWhiteBG();

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (json.ok) {
          mainForm.style.display = "none";
          thankYouPage.style.display = "block";
        } else {
          notif.innerHTML = `<div class="alert alert-danger">❌ ${json.message}</div>`;
        }
      } catch (err) {
        notif.innerHTML = `<div class="alert alert-danger">❌ ${err}</div>`;
      }
    });

    // Tombol isi form baru tanpa reload
    document.getElementById("newFormBtn").addEventListener("click", () => {
      form.reset();
      signaturePad.clear();
      notif.innerHTML = "";
      thankYouPage.style.display = "none";
      mainForm.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
